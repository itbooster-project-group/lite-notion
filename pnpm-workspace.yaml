# Скрипты выполняются встроенным shell pnpm, а не cmd.exe. Без этого префикс
# переменной окружения — `VAR=value command` в `steiger:web` — работает только
# на POSIX, а на Windows cmd.exe принимает `VAR=value` за имя программы.
shellEmulator: true

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  bcrypt: true
  esbuild: true
  msw: true
  prisma: true

catalog:
  "@prisma/adapter-pg": ^7.9.1
  "@prisma/client": ^7.9.1
  "@types/node": ^22.0.0
  "@types/pg": ^8.21.0
  pg: ^8.23.0
  prisma: ^7.9.1
  tsx: ^4.23.12
  typescript: ^5.9.0
  vitest: ^4.0.0
  yjs: ^13.6.32
