services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lite_notion
      POSTGRES_PASSWORD: lite_notion
      POSTGRES_USER: lite_notion
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
