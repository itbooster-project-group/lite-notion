# Адреса кластеров указывают на хост: в development web, API и collaboration
# запускаются процессами через `pnpm dev`, а не контейнерами.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                # Без этого блока запрос смены протокола не проходит и WebSocket
                # ломается на рукопожатии.
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: ingress
                  virtual_hosts:
                    - name: ingress
                      domains: ["*"]
                      routes:
                        # Внутренние маршруты снаружи недостижимы.
                        - match: { prefix: "/internal/" }
                          direct_response:
                            status: 404
                            body: { inline_string: "not found" }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        - match: { prefix: "/collaboration" }
                          route:
                            cluster: collaboration
                            # Таймаут простоя выше интервала keepalive протокола,
                            # иначе шлюз рвёт исправные соединения.
                            timeout: 0s
                            idle_timeout: 600s
                            upgrade_configs:
                              - upgrade_type: websocket
                                enabled: true
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        # Маршруты, которые вызывает заведомо неаутентифицированный
                        # клиент. Перечень явный: всё остальное под /api/v1 закрыто.
                        - match: { path: "/api/v1/auth/register" }
                          route: { cluster: api }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { path: "/api/v1/auth/login" }
                          route: { cluster: api }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { path: "/api/v1/auth/refresh" }
                          route: { cluster: api }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { path: "/api/v1/health" }
                          route: { cluster: api }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        # Остальной публичный API закрыт по умолчанию.
                        - match: { prefix: "/api/v1/" }
                          route: { cluster: api }

                        # Frontend: публично раздаваемая статика. Аутентификация
                        # здесь сделала бы недостижимой саму страницу входа.
                        - match: { prefix: "/" }
                          route: { cluster: web }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  # Клиентские копии заголовков личности снимаются ДО проверки: на
                  # маршруте они затёрли бы то, что проставил ext_authz.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-user-id
                          - remove: x-session-id
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # Заголовок с токеном нужно передать проверке явно.
                      allowed_headers:
                        patterns:
                          - exact: authorization
                            ignore_case: true
                      # Проверку подписи делает API: секрет подписи остаётся в одном
                      # процессе, и реализация проверки — одна на HTTP и WebSocket.
                      http_service:
                        server_uri:
                          uri: http://host.docker.internal:3001
                          cluster: api
                          timeout: 2s
                        path_prefix: /internal/authenticate
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-user-id
                                ignore_case: true
                              - exact: x-session-id
                                ignore_case: true
                      failure_mode_allow: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: api
      type: STRICT_DNS
      # host.docker.internal резолвится и в IPv6, а процессы слушают IPv4.
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3001 }
    - name: web
      type: STRICT_DNS
      # host.docker.internal резолвится и в IPv6, а процессы слушают IPv4.
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: web
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3000 }
    - name: collaboration
      type: STRICT_DNS
      # host.docker.internal резолвится и в IPv6, а процессы слушают IPv4.
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: collaboration
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3002 }
