name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dedupe --check
      - run: pnpm steiger:web
      - run: pnpm --filter @lite-notion/web run typecheck
      - run: pnpm --filter @lite-notion/web run test
      - run: pnpm --filter @lite-notion/web run build

  api:
    name: api
    runs-on: ubuntu-latest
    env:
      CORS_ORIGIN: http://localhost:3000
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REFRESH_TOKEN_TTL_S: ${{ secrets.REFRESH_TOKEN_TTL_S }}
      BCRYPT_ROUNDS: ${{ secrets.BCRYPT_ROUNDS }}
      ACCESS_TOKEN_TTL_S: ${{ secrets.ACCESS_TOKEN_TTL_S }}
      NODE_ENV: test
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm --filter @lite-notion/api run typecheck
      - run: pnpm --filter @lite-notion/api run test
      - run: pnpm --filter @lite-notion/api run build

  collaboration:
    name: collaboration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lite_notion
          POSTGRES_PASSWORD: lite_notion
          POSTGRES_DB: lite_notion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lite_notion -d lite_notion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COLLABORATION_ALLOWED_ORIGIN: http://localhost:3000
      WEBSOCKET_MAX_PAYLOAD_BYTES: 1048576
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NODE_ENV: test
      PORT: 3002
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lite-notion/database run db:migrate:deploy
      - run: pnpm --filter @lite-notion/collaboration run typecheck
      - run: pnpm --filter @lite-notion/collaboration run test
      - run: pnpm --filter @lite-notion/collaboration run test:integration
      - run: pnpm --filter @lite-notion/collaboration run build
