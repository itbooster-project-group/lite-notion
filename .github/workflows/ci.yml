name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lite-notion/web run typecheck
      - run: pnpm --filter @lite-notion/web run test
      - run: pnpm --filter @lite-notion/web run build

  api:
    name: api
    runs-on: ubuntu-latest
    env:
      # Deterministic test-only values keep pull-request checks independent of repository secrets.
      CORS_ORIGIN: http://localhost:3000
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_URL: postgresql://lite_notion:lite_notion@localhost:5432/lite_notion?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      REFRESH_TOKEN_TTL_S: 2592000
      BCRYPT_ROUNDS: 12
      ACCESS_TOKEN_TTL_S: 900
      NODE_ENV: test
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm --filter @lite-notion/api run typecheck
      - run: pnpm --filter @lite-notion/api run test
      - run: pnpm --filter @lite-notion/api run build
