name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lite-notion/web run typecheck
      - run: pnpm --filter @lite-notion/web run test
      - run: pnpm --filter @lite-notion/web run build

  api:
    name: api
    runs-on: ubuntu-latest
    env:
      CORS_ORIGIN: http://localhost:3000
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REFRESH_TOKEN_TTL_S: ${{ secrets.REFRESH_TOKEN_TTL_S }}
      BCRYPT_ROUNDS: ${{ secrets.BCRYPT_ROUNDS }}
      ACCESS_TOKEN_TTL_S: ${{ secrets.ACCESS_TOKEN_TTL_S }}
      NODE_ENV: test
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm --filter @lite-notion/api run typecheck
      - run: pnpm --filter @lite-notion/api run test
      - run: pnpm --filter @lite-notion/api run build
